
name: BugBusters Hostinger Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Check Live Website
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://darkgoldenrod-hare-438191.hostingersite.com

    steps:
      - name: Wait for Hostinger deployment
        run: sleep 90

      - name: Verify live website
        run: |
          curl --fail \
            --retry 15 \
            --retry-delay 15 \
            --retry-all-errors \
            --max-time 30 \
            https://darkgoldenrod-hare-438191.hostingersite.com

          echo "BugBusters website is responding successfully!"
